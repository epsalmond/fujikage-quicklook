name: FujikageQL
options:
  bundleIdPrefix: com.epsalmond.fujikage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: KA3Y4C7M3R
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: "YES"
    COMBINE_HIDPI_IMAGES: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

targetTemplates:
  QLExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

targets:
  FujikageQL:
    type: application
    platform: macOS
    sources:
      - path: Sources/Host
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Sources/RAFJPEG
      - path: Resources
    dependencies:
      - target: FujikageQLPreview
        embed: true
        codeSign: true
      - target: FujikageQLThumbnail
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epsalmond.fujikage.quicklook
        PRODUCT_NAME: FujikageQL
        CODE_SIGN_ENTITLEMENTS: Sources/Host/FujikageQL.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHighResolutionCapable: "YES"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Sources/Host/Info.plist
      properties:
        CFBundleDisplayName: FujikageQL
        CFBundleName: FujikageQL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Fujifilm RAW Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.epsalmond.fujikage.raf
              - com.fuji.raw-image
            CFBundleTypeExtensions:
              - raf
              - RAF
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.epsalmond.fujikage.raf
            UTTypeDescription: Fujifilm RAF Image
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - raf
              public.mime-type:
                - image/x-fuji-raf

  FujikageQLPreview:
    templates: [QLExtension]
    sources:
      - path: Sources/Preview
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Sources/RAFJPEG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epsalmond.fujikage.quicklook.preview
        PRODUCT_NAME: FujikageQLPreview
        INFOPLIST_FILE: Sources/Preview/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Preview/Preview.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: FujikageQL Preview

  FujikageQLThumbnail:
    templates: [QLExtension]
    sources:
      - path: Sources/Thumbnail
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Sources/RAFJPEG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epsalmond.fujikage.quicklook.thumbnail
        PRODUCT_NAME: FujikageQLThumbnail
        INFOPLIST_FILE: Sources/Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Thumbnail/Thumbnail.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: FujikageQL Thumbnails

  FujikageQLTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: FujikageQL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epsalmond.fujikage.quicklook.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FujikageQL.app/Contents/MacOS/FujikageQL"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  FujikageQL:
    build:
      targets:
        FujikageQL: all
        FujikageQLPreview: all
        FujikageQLThumbnail: all
        FujikageQLTests: [test]
    test:
      targets:
        - FujikageQLTests
      environmentVariables:
        # Real camera file for the real-RAF test. `FUJIKAGE_TEST_RAF=... make test`.
        FUJIKAGE_TEST_RAF: $(FUJIKAGE_TEST_RAF)
